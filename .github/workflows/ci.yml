name: Gree Bot checks

on:
  push:
    branches:
      - main
      - gree-conversation-rehaul
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Syntax and policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency advisories
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run conversation policy tests
        run: npm test
